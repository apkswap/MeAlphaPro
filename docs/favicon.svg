 <linearGradient id="gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff8a8"/><stop offset=".22" stop-color="#ffe45a"/><stop offset=".55" stop-color="#ffb900"/><stop offset=".82" stop-color="#e88900"/><stop offset="1" stop-color="#fff0a0"/></linearGradient>
