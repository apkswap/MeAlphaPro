<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111023">
  <title>Returning to MeAlpha Pro</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111023;color:#f7f7fb;font:16px system-ui,sans-serif}
    main{width:min(90%,440px);padding:32px;border:1px solid #34324c;border-radius:22px;background:#1b1930;text-align:center;box-sizing:border-box}
    a{display:inline-block;margin-top:18px;padding:12px 20px;border-radius:12px;background:#8b5cf6;color:white;text-decoration:none;font-weight:700}
    p{color:#c4c1d7;line-height:1.7}
  </style>
</head>
<body>
  <main>
    <h1>Returning to MeAlpha Pro…</h1>
    <p>Dropbox authorization is complete. If the app does not open automatically, use the button below.</p>
    <a id="open-app" href="#">Open MeAlpha Pro</a>
  </main>
  <script>
    (function () {
      var deepLink = 'com.mealpha.pro://oauth/dropbox/callback' + window.location.search + window.location.hash;
      document.getElementById('open-app').href = deepLink;
      window.location.replace(deepLink);
    })();
  </script>
</body>
</html>
