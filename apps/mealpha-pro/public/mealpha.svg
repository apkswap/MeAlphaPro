<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">MeAlpha brand mark</title>
  <desc id="desc">A continuous monogram combining a rising path and an infinity loop.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="16" x2="232" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17132f"/><stop offset=".55" stop-color="#101d39"/><stop offset="1" stop-color="#071f2d"/>
    </linearGradient>
    <linearGradient id="alpha" x1="48" y1="48" x2="211" y2="211" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4b5fd"/><stop offset=".48" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
