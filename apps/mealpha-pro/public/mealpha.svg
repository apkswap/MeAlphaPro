<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MeAlpha Pro</title>
  <desc id="desc">A bold gold M monogram with a violet upward-growth sweep on a deep plum background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#241044"/>
      <stop offset=".54" stop-color="#120a29"/>
      <stop offset="1" stop-color="#080612"/>
    </linearGradient>
    <radialGradient id="ambient" cx="48%" cy="42%" r="68%">
      <stop stop-color="#7a38bd" stop-opacity=".52"/>
      <stop offset="1" stop-color="#7a38bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff5c9"/>
      <stop offset=".2" stop-color="#ffdf83"/>
      <stop offset=".52" stop-color="#e9ad3d"/>
      <stop offset=".8" stop-color="#c47c27"/>
      <stop offset="1" stop-color="#ffe9a7"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#7131c6"/>
      <stop offset=".55" stop-color="#ba70fa"/>
      <stop offset="1" stop-color="#e1a8ff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5d98c" stop-opacity=".9"/>
      <stop offset="1" stop-color="#a66fe8" stop-opacity=".35"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset dy="10" result="offset"/>
      <feComponentTransfer in="offset" result="shadow"><feFuncA type="linear" slope=".48"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="12" y="12" width="488" height="488" rx="112"/></clipPath>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#background)"/>
  <g clip-path="url(#tile)">
    <ellipse cx="256" cy="225" rx="250" ry="235" fill="url(#ambient)"/>
    <ellipse cx="254" cy="250" rx="174" ry="155" fill="#a65be6" opacity=".12" filter="url(#glow)"/>
    <path d="M86 370 V157 C86 137 102 121 122 121 H151 C171 121 185 132 198 149 L256 222 L314 149 C327 132 341 121 361 121 H390 C410 121 426 137 426 157 V370"
      fill="none" stroke="#5e381e" stroke-width="88" stroke-linecap="round" stroke-linejoin="round" opacity=".5" transform="translate(0 9)"/>
    <path d="M86 370 V157 C86 137 102 121 122 121 H151 C171 121 185 132 198 149 L256 222 L314 149 C327 132 341 121 361 121 H390 C410 121 426 137 426 157 V370"
      fill="none" stroke="url(#gold)" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
    <path d="M86 370 V157 C86 137 102 121 122 121 H151 C171 121 185 132 198 149 L256 222 L314 149 C327 132 341 121 361 121 H390 C410 121 426 137 426 157 V370"
      fill="none" stroke="#fff6d6" stroke-opacity=".46" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M66 418 C174 397 269 352 344 285 C378 255 405 220 432 178"
      fill="none" stroke="#180d2c" stroke-width="26" stroke-linecap="round" opacity=".8"/>
    <path d="M66 410 C174 389 269 344 344 277 C378 247 405 212 432 170"
      fill="none" stroke="url(#violet)" stroke-width="17" stroke-linecap="round"/>
    <path d="M405 164 L447 128 L440 185 L426 174 L414 190 Z" fill="url(#gold)" stroke="#fff1bd" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M84 431 C184 411 275 367 348 302" fill="none" stroke="#f5d48a" stroke-opacity=".34" stroke-width="3" stroke-linecap="round"/>
  </g>
  <rect x="12" y="12" width="488" height="488" rx="112" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="2"/>
</svg>