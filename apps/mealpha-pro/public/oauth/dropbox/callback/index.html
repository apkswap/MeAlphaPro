<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Returning to MeAlpha Pro…</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b1220;color:#f8fafc;font:16px system-ui,sans-serif}.card{width:min(100%,440px);padding:28px;border:1px solid #334155;border-radius:22px;background:#111c32;text-align:center;box-shadow:0 24px 80px #0008}.mark{font-size:13px;font-weight:800;letter-spacing:.14em;color:#38bdf8}.muted{color:#94a3b8;line-height:1.7}.link{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:12px;background:#0ea5e9;color:#07111f;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">MEALPHA PRO</div>
    <h1>Returning to the app</h1>
    <p class="muted" id="message">Dropbox authorization was received. This page will securely return the sign-in result to MeAlpha Pro.</p>
    <a class="link" id="continue" href="com.mealpha.pro://oauth/dropbox/callback">Open MeAlpha Pro</a>
  </main>
  <script>
    (function () {
      var target = 'com.mealpha.pro://oauth/dropbox/callback' + window.location.search + window.location.hash;
      var link = document.getElementById('continue');
      link.href = target;
      var params = new URLSearchParams(window.location.search);
      if (!params.has('code') && !params.has('error')) {
        document.getElementById('message').textContent = 'The Dropbox response is missing. Return to MeAlpha Pro and start the connection again.';
        link.textContent = 'Return to MeAlpha Pro';
      }
      window.location.replace(target);
    })();
  </script>
</body>
</html>
