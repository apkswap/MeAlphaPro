name: MeAlpha Pro UI and release builds

on:
  push:
    branches:
      - fix/dropbox-settings-save-logo-sizing
    paths:
      - "apps/mealpha-pro/src/**"
      - "apps/mealpha-pro/package.json"
      - "apps/mealpha-pro/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mealpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install vector icon renderer
        run: npm install --no-save --package-lock=false --workspaces=false sharp
      - name: Generate full-resolution Windows icon
        run: node apps/mealpha-pro/scripts/generate-brand-assets.mjs --windows
      - name: TypeScript validation
        run: npm run typecheck --workspace apps/mealpha-pro
      - name: Build Windows x64 installer
        run: npm run desktop:build --workspace apps/mealpha-pro
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Windows-x64
          path: apps/mealpha-pro/release/*.exe
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "GitHub runner Android SDK was not found." >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $SDK_ROOT/cmdline-tools." >&2
            exit 1
          fi
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          # sdkmanager may finish reading licenses before `yes` exits; ignore that harmless SIGPIPE,\n          # but keep sdkmanager failures fatal.\n          set +o pipefail\n          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null\n          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web assets
        run: npm run build --workspace apps/mealpha-pro
      - name: Generate Android project
        working-directory: apps/mealpha-pro
        run: npx cap add android
      - name: Build Android APK
        working-directory: apps/mealpha-pro/android
        run: chmod +x ./gradlew && ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Android-APK
          path: apps/mealpha-pro/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
