name: MeAlpha Pro UI and release builds

on:
  push:
    branches:
      - fix/dropbox-settings-save-logo-sizing
    paths:
      - "apps/mealpha-pro/src/**"
      - "apps/mealpha-pro/package.json"
      - "apps/mealpha-pro/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mealpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck --workspace apps/mealpha-pro
      - name: Build Windows x64 installer
        run: npm run desktop:build --workspace apps/mealpha-pro
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Windows-x64
          path: apps/mealpha-pro/release/*.exe
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web assets
        run: npm run build --workspace apps/mealpha-pro
      - name: Generate Android project
        working-directory: apps/mealpha-pro
        run: npx cap add android
      - name: Build Android APK
        working-directory: apps/mealpha-pro/android
        run: ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Android-APK
          path: apps/mealpha-pro/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
