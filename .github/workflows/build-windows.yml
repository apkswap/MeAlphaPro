name: Build MeAlpha Pro for Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/blue-dual-theme-build-validation
      - feature/cinematic-3d-dashboard
      - feature/premium-command-center-ui
      - fix/dropbox-settings-save-logo-sizing
      - ui/reference-glass-navigation
      - release/2.1.0-from-cbd4dfc
      - feat/hierarchical-goals-task-reminders
      - fix/goals-hierarchy-integrity
      - fix/restore-purple-branding-profile-goals
    paths:
      - "apps/**"
      - "packages/**"
      - "docs/favicon.svg"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/android-debug.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/ui-smoke.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install vector icon renderer
        run: npm install --no-save --package-lock=false --workspaces=false sharp
      - name: Generate multi-resolution Windows application icon
        run: node apps/mealpha-pro/scripts/generate-brand-assets.mjs --windows
      - name: Build Windows installer
        run: npm run desktop:build --workspace apps/mealpha-pro
      - name: Smoke-test packaged Windows application
        run: node apps/mealpha-pro/scripts/electron-smoke.cjs
      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "apps/mealpha-pro/release" -Filter "*.exe" -File
          if (-not $files) {
            throw "Build completed but no Windows EXE installer was found."
          }
          $files | Format-Table Name, Length
      - name: Prepare Windows installer artifact metadata
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/mealpha-pro/release" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Windows x64 installer was not found." }
          $version = node -p "require('./apps/mealpha-pro/package.json').version"
          $sha256 = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Copy-Item $installer.FullName "release-assets/$($installer.Name)"
          @(
            "Application: MeAlpha Pro"
            "Version: $version"
            "Architecture: x64"
            "Installer: $($installer.Name)"
            "SHA256: $sha256"
            "Git commit: $env:GITHUB_SHA"
            "Source branch: $env:GITHUB_REF_NAME"
            "Build type: NSIS installer; packaged Windows app smoke-tested"
          ) | Set-Content -Path "release-assets/BUILD-INFO.txt" -Encoding utf8
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
