name: Build MeAlpha Pro for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/blue-dual-theme-build-validation
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run desktop:build --workspace apps/mealpha-pro

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "apps/mealpha-pro/release" -Filter "*.exe" -File
          if (-not $files) {
            throw "Build completed but no Windows EXE installer was found."
          }
          $files | Format-Table Name, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Windows-x64
          path: apps/mealpha-pro/release/*.exe
          if-no-files-found: error
          retention-days: 14
