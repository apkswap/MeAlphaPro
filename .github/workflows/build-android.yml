name: Build MeAlpha Pro Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/blue-dual-theme-build-validation
      - feature/cinematic-3d-dashboard
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          ls "$ANDROID_HOME"
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build --workspace apps/mealpha-pro

      - name: Create Android project
        working-directory: apps/mealpha-pro
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: apps/mealpha-pro
        run: npx cap sync android
      - name: Configure Android Dropbox deep link
        working-directory: apps/mealpha-pro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text()
          marker = 'android:scheme="com.mealpha.pro"'
          if marker not in xml:
              activity_start = xml.find("<activity")
              activity_end = xml.find("</activity>", activity_start)
              if activity_start < 0 or activity_end < 0:
                  raise SystemExit("Could not locate the Android main activity in AndroidManifest.xml")
              intent_filter = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.mealpha.pro" android:host="oauth" android:pathPrefix="/dropbox/callback" />
                      </intent-filter>
              """
              xml = xml[:activity_end] + intent_filter + xml[activity_end:]
              path.write_text(xml)
          PY

      - name: Build debug APK
        working-directory: apps/mealpha-pro/android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -f apps/mealpha-pro/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh apps/mealpha-pro/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Android-APK
          path: apps/mealpha-pro/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
