name: Build MeAlpha Pro Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          ls "$ANDROID_HOME"
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build --workspace apps/mealpha-pro

      - name: Create Android project
        working-directory: apps/mealpha-pro
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: apps/mealpha-pro
        run: npx cap sync android

      - name: Wire Google Drive scopes into Android activity
        working-directory: apps/mealpha-pro
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java -print -quit)
          test -n "$MAIN_ACTIVITY"
          python3 - "$MAIN_ACTIVITY" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          imports = """import android.content.Intent;
          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginHandle;
          """
          if "ModifiedMainActivityForSocialLoginPlugin" not in source:
              source = re.sub(r"(public class MainActivity extends BridgeActivity)(\s*\{)", r"\1 implements ModifiedMainActivityForSocialLoginPlugin\2", source, count=1)
          package_end = source.find(";")
          source = source[:package_end + 1] + "\n\n" + imports + source[package_end + 1:]
          if "handleGoogleLoginIntent" not in source:
              methods = '''
              @Override
              public void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN
                          && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                      PluginHandle handle = getBridge().getPlugin("SocialLogin");
                      if (handle == null) return;
                      Plugin plugin = handle.getInstance();
                      if (plugin instanceof SocialLoginPlugin) {
                          ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
                      }
                  }
              }

              @Override
              public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
              '''
              source = source.rstrip()
              source = source[:-1] + methods + "\n}\n"
          path.write_text(source)
          print(f"Patched {path}")
          PY
      - name: Build debug APK
        working-directory: apps/mealpha-pro/android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -f apps/mealpha-pro/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh apps/mealpha-pro/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Android-APK
          path: apps/mealpha-pro/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
