name: Build MeAlpha Pro Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/blue-dual-theme-build-validation
      - feature/cinematic-3d-dashboard
      - feature/premium-command-center-ui
      - fix/dropbox-settings-save-logo-sizing
      - feat/hierarchical-goals-task-reminders
      - fix/goals-hierarchy-integrity
      - fix/restore-purple-branding-profile-goals
    paths:
      - "apps/**"
      - "packages/**"
      - "docs/favicon.svg"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/ui-smoke.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure Android SDK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk -or -not (Test-Path $sdk)) { throw "GitHub runner Android SDK was not found." }
          $manager = Get-ChildItem (Join-Path $sdk "cmdline-tools") -Recurse -Filter "sdkmanager.bat" -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $manager) { throw "Android sdkmanager.bat was not found." }
          $env:ANDROID_SDK_ROOT = $sdk
          $env:ANDROID_HOME = $sdk
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $manager.FullName --sdk_root=$sdk --licenses | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Android SDK license acceptance failed." }
          & $manager.FullName --sdk_root=$sdk "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK platform installation failed." }
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web application
        run: npm run build --workspace apps/mealpha-pro
      - name: Create Android project
        working-directory: apps/mealpha-pro
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: apps/mealpha-pro
        run: npx cap sync android
      - name: Set Android release version
        working-directory: apps/mealpha-pro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          old_code = "versionCode 1"
          old_name = 'versionName "1.0"'
          if old_code not in text or old_name not in text:
              raise SystemExit("Generated Gradle version fields were not found")
          text = text.replace(old_code, "versionCode 200", 1)
          text = text.replace(old_name, 'versionName "2.0.0"', 1)
          path.write_text(text)
          PY
      - name: Install vector icon renderer
        run: npm install --no-save --package-lock=false --workspaces=false sharp
      - name: Generate full-resolution Android launcher icons
        working-directory: apps/mealpha-pro
        run: node scripts/generate-brand-assets.mjs --android
      - name: Configure Android Dropbox deep link
        working-directory: apps/mealpha-pro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text()
          permission = '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if permission not in xml:
              manifest_start = xml.find("<manifest")
              manifest_end = xml.find(">", manifest_start)
              if manifest_start < 0 or manifest_end < 0:
                  raise SystemExit("Could not locate the Android manifest root element")
              xml = xml[:manifest_end + 1] + "\n    " + permission + xml[manifest_end + 1:]
          marker = 'android:scheme="com.mealpha.pro"'
          if marker not in xml:
              activity_start = xml.find("<activity")
              activity_end = xml.find("</activity>", activity_start)
              if activity_start < 0 or activity_end < 0:
                  raise SystemExit("Could not locate the Android main activity in AndroidManifest.xml")
              intent_filter = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.mealpha.pro" android:host="oauth" android:pathPrefix="/dropbox/callback" />
                      </intent-filter>
              """
              xml = xml[:activity_end] + intent_filter + xml[activity_end:]
              path.write_text(xml)
          PY
      - name: Build debug APK
        working-directory: apps/mealpha-pro/android
        run: .\gradlew.bat assembleDebug
      - name: Verify APK
        shell: pwsh
        run: |
          $apk = "apps/mealpha-pro/android/app/build/outputs/apk/debug/app-debug.apk"
          if (-not (Test-Path $apk)) { throw "APK output is missing." }
          $sdk = $env:ANDROID_SDK_ROOT
          if (-not $sdk) { $sdk = $env:ANDROID_HOME }
          if (-not $sdk) { throw "Android SDK path is missing." }
          $buildTools = Get-ChildItem (Join-Path $sdk "build-tools") -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $aapt = Join-Path $buildTools.FullName "aapt.exe"
          if (-not (Test-Path $aapt)) { throw "aapt is missing from the installed Android build tools." }
          $badging = & $aapt dump badging $apk
          $packageLine = $badging | Where-Object { $_.StartsWith("package: name='com.mealpha.pro'") } | Select-Object -First 1
          if (-not $packageLine) { throw "APK package name is not com.mealpha.pro." }
          if ($packageLine -notmatch "versionCode='200'") { throw "APK versionCode is not 200: $packageLine" }
          if ($packageLine -notmatch "versionName='2.0.0'") { throw "APK versionName is not 2.0.0: $packageLine" }
          Get-Item $apk | Format-Table Name, Length
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Android-APK
          path: apps/mealpha-pro/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
