name: MeAlpha Pro Preview Builds

on:
  push:
    branches:
      - fix/dropbox-settings-save-logo-sizing
    paths:
      - "apps/mealpha-pro/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/preview-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mealpha-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install brand asset generator dependency
        run: npm install --no-save --no-audit --no-fund sharp
      - name: Prepare Windows icon
        shell: pwsh
        run: ./apps/mealpha-pro/scripts/prepare-windows-icon.ps1
      - name: Build Windows installer
        run: npm run desktop:build --workspace apps/mealpha-pro
      - name: Publish Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Windows-x64
          path: apps/mealpha-pro/release/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web application
        run: npm run build --workspace apps/mealpha-pro
      - name: Create Android project
        working-directory: apps/mealpha-pro
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: apps/mealpha-pro
        run: npx cap sync android
      - name: Configure Dropbox deep link
        working-directory: apps/mealpha-pro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text()
          marker = 'android:scheme="com.mealpha.pro"'
          if marker not in xml:
              start = xml.find("<activity")
              end = xml.find("</activity>", start)
              if start < 0 or end < 0:
                  raise SystemExit("Android main activity was not found.")
              intent_filter = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.mealpha.pro" android:host="oauth" android:pathPrefix="/dropbox/callback" />
                      </intent-filter>
              """
              path.write_text(xml[:end] + intent_filter + xml[end:])
          PY
      - name: Install brand asset generator dependency
        run: npm install --no-save --no-audit --no-fund sharp
      - name: Generate Android launcher icons
        run: |
          python3 -m pip install --user --break-system-packages Pillow
          python3 apps/mealpha-pro/scripts/generate-android-icons.py
      - name: Build installable APK
        working-directory: apps/mealpha-pro/android
        run: chmod +x ./gradlew && ./gradlew assembleDebug
      - name: Publish Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Android-APK
          path: apps/mealpha-pro/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
