name: MeAlpha Pro Android Debug APK

on:
  push:
    branches:
      - fix/dropbox-settings-save-logo-sizing
      - ui/glassy-v10-interactive-review
      - ui/command-center-navigation-refresh
      - fix/deep-ui-audit-2026-11-28
    paths:
      - "apps/mealpha-pro/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install vector icon renderer
        run: npm install --no-save --no-audit --no-fund sharp
      - name: Build web application
        run: npm run build --workspace apps/mealpha-pro
      - name: Create Android project
        working-directory: apps/mealpha-pro
        run: npx cap add android
      - name: Sync Capacitor
        working-directory: apps/mealpha-pro
        run: npx cap sync android
      - name: Configure Android Dropbox deep link
        working-directory: apps/mealpha-pro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text()
          marker = 'android:scheme="com.mealpha.pro"'
          if marker not in xml:
              activity_start = xml.find("<activity")
              activity_end = xml.find("</activity>", activity_start)
              if activity_start < 0 or activity_end < 0:
                  raise SystemExit("Could not locate Android main activity")
              intent_filter = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.mealpha.pro" android:host="oauth" android:pathPrefix="/dropbox/callback" />
                      </intent-filter>
              """
              xml = xml[:activity_end] + intent_filter + xml[activity_end:]
              path.write_text(xml)
          PY
      - name: Generate Android launcher icons
        run: |
          python3 -m pip install --user --break-system-packages Pillow
          python3 apps/mealpha-pro/scripts/generate-android-icons.py
      - name: Build debug APK
        working-directory: apps/mealpha-pro/android
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean assembleDebug
      - name: Verify debug APK
        run: |
          APK="apps/mealpha-pro/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release-assets
          cp "$APK" release-assets/MeAlpha-Pro-Android-debug.apk
          sha256sum release-assets/MeAlpha-Pro-Android-debug.apk > release-assets/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MeAlpha-Pro-Android-debug
          path: |
            release-assets/MeAlpha-Pro-Android-debug.apk
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
