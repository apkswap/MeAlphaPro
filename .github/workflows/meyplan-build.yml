name: MeyPlan Pro validation and builds

on:
  push:
    branches:
      - main
      - feat/next-gen-local-first-roadmap
      - feat/mealpha-nextgen-experience
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meyplan-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: TypeScript and web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --non-interactive --network-timeout 600000
      - name: Type check
        run: yarn workspace mealpha-pro typecheck
      - name: Build web application
        run: yarn workspace mealpha-pro build
      - uses: actions/upload-artifact@v4
        with:
          name: meyplan-web-dist
          path: apps/mealpha-pro/dist/
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows x64 installer
    runs-on: windows-latest
    needs: web-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --non-interactive --network-timeout 600000
      - name: Build Windows installer
        run: yarn workspace mealpha-pro desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: meyplan-pro-windows-x64
          path: apps/mealpha-pro/release/*.exe
          if-no-files-found: error
          retention-days: 14

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: web-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        run: yarn install --non-interactive --network-timeout 600000
      - name: Generate Android platform
        working-directory: apps/mealpha-pro
        run: npx cap add android
      - name: Build web assets and sync Android
        run: yarn workspace mealpha-pro android:sync
      - name: Wire Google Drive scopes into Android activity
        working-directory: apps/mealpha-pro
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java -print -quit)
          test -n "$MAIN_ACTIVITY"
          python3 - "$MAIN_ACTIVITY" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          imports = """import android.content.Intent;
          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginHandle;
          """
          if "ModifiedMainActivityForSocialLoginPlugin" not in source:
              source = re.sub(r"(public class MainActivity extends BridgeActivity)(\s*\{)", r"\1 implements ModifiedMainActivityForSocialLoginPlugin\2", source, count=1)
          package_end = source.find(";")
          source = source[:package_end + 1] + "\n\n" + imports + source[package_end + 1:]
          if "handleGoogleLoginIntent" not in source:
              methods = '''
              @Override
              public void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN
                          && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                      PluginHandle handle = getBridge().getPlugin("SocialLogin");
                      if (handle == null) return;
                      Plugin plugin = handle.getInstance();
                      if (plugin instanceof SocialLoginPlugin) {
                          ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
                      }
                  }
              }

              @Override
              public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
              '''
              source = source.rstrip()
              source = source[:-1] + methods + "\n}\n"
          path.write_text(source)
          print(f"Patched {path}")
          PY
      - name: Print Android OAuth signing fingerprints
        working-directory: apps/mealpha-pro/android
        run: ./gradlew signingReport
      - name: Build debug APK
        working-directory: apps/mealpha-pro/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: meyplan-pro-android-debug
          path: apps/mealpha-pro/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
