name: MeyPlan Pro validation and builds

on:
  push:
    branches:
      - main
      - feat/next-gen-local-first-roadmap
      - feat/mealpha-nextgen-experience
      - feat/mealpha-performance-studio
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meyplan-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: TypeScript and web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: yarn install --non-interactive --network-timeout 600000
      - name: Type check
        run: yarn workspace mealpha-pro typecheck
      - name: Build web application
        run: yarn workspace mealpha-pro build
      - uses: actions/upload-artifact@v4
        with:
          name: meyplan-web-dist
          path: apps/mealpha-pro/dist/
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows x64 installer
    runs-on: windows-latest
    needs: web-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies with retry
        shell: pwsh
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          $attempt = 0
          do {
            $attempt++
            Write-Host "Dependency installation attempt $attempt of 3"
            yarn install --non-interactive --network-timeout 600000
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "Install failed; waiting before retry..."
              Start-Sleep -Seconds (15 * $attempt)
            }
          } while ($attempt -lt 3)
          exit 1
      - name: Build Windows installer with retry
        shell: pwsh
        run: |
          $attempt = 0
          do {
            $attempt++
            Write-Host "Windows packaging attempt $attempt of 3"
            yarn workspace mealpha-pro desktop:build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "Packaging failed; waiting before retry..."
              Start-Sleep -Seconds (30 * $attempt)
            }
          } while ($attempt -lt 3)
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: meyplan-pro-windows-x64
          path: apps/mealpha-pro/release/*.exe
          if-no-files-found: error
          retention-days: 14

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: web-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable Yarn Classic
        run: corepack prepare yarn@1.22.22 --activate
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: yarn install --non-interactive --network-timeout 600000
      - name: Generate Android platform
        working-directory: apps/mealpha-pro
        run: npx cap add android
      - name: Build web assets and sync Android
        run: yarn workspace mealpha-pro android:sync
      - name: Build debug APK
        working-directory: apps/mealpha-pro/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: meyplan-pro-android-debug
          path: apps/mealpha-pro/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
